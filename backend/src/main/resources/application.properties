# SpotMeet Backend - application.properties
# Valores sensiveis vem do arquivo backend/.env (ver .env.example).
# Variaveis de ambiente do sistema tem precedencia sobre o .env.
spring.config.import=optional:file:.env[.properties]

# --- Servidor ---
server.port=${SERVER_PORT:8080}

# --- Banco de dados PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spotmeet_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
spotmeet.jwt.secret=${JWT_SECRET}
spotmeet.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Spring Actuator (monitoramento SysAdmin) ---
management.endpoints.web.exposure.include=health,info,metrics,env,loggers
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# --- E-mail (JavaMailSender) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Identificacao publica do servico (usada pelo app para descobrir o backend na rede local via GET /actuator/info)
management.info.env.enabled=true
info.app.name=SpotMeet
info.app.description=SpotMeet API
